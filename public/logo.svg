  <!-- Monogram / Banner -->
  <rect x="74" y="162" width="92" height="22" rx="11" fill="url(#goldGrad)"/>
  <text x="120" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#7C2D12" letter-spacing="2">L P U</text>
</svg>
