  <path d="M120 32C150 48 185 52 185 52V124C185 168 152 198 120 208C88 198 55 168 55 124V52C55 52 90 48 120 32Z" 
        fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

  <!-- Architectural Tower & Residence Silhouette -->
  <!-- Central Pediment / Roof -->
  <polygon points="120,62 82,88 158,88" fill="url(#goldGrad)"/>
  
  <!-- Central Building Body -->
  <rect x="86" y="88" width="68" height="66" rx="4" fill="#FFFFFF"/>
  
  <!-- Tower Pillars & Arches -->
  <rect x="94" y="96" width="10" height="22" rx="5" fill="#C2410C"/>
  <rect x="115" y="96" width="10" height="22" rx="5" fill="#C2410C"/>
  <rect x="136" y="96" width="10" height="22" rx="5" fill="#C2410C"/>

  <!-- Main Entrance Arch -->
  <path d="M110 154V134C110 128.5 114.5 124 120 124C125.5 124 130 128.5 130 134V154H110Z" fill="#C2410C"/>

  <!-- Academic Graduation Star / Crest Motif -->
